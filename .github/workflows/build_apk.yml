name: Build Audio Player APK

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create clean Flutter source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lib
          mkdir -p lib
          cp main.dart lib/main.dart

      - name: Scaffold native Android project
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.vish0420 --project-name audio_player_only _scaffold
          cp -r _scaffold/android ./android
          rm -rf _scaffold

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          APP_GRADLE=android/app/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$APP_GRADLE"
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' "$APP_GRADLE"
          ROOT_GRADLE=android/build.gradle.kts
          cat >> "$ROOT_GRADLE" <<'KOTLIN'

          subprojects {
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.api.dsl.LibraryExtension> {
                      compileSdk = 36
                  }
              }
          }
          KOTLIN
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" >/dev/null

      - name: Configure Android audio permissions and background service
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - "$MANIFEST" <<'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              content = f.read()
          marker = '<application'
          permissions = '''
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
          '''
          if 'android.permission.READ_MEDIA_AUDIO' not in content:
              i = content.index(marker)
              content = content[:i] + permissions + '\n    ' + content[i:]
          content = content.replace('android:name=".MainActivity"', 'android:name="com.ryanheise.audioservice.AudioServiceActivity"')
          service = '''
              <service
                  android:name="com.ryanheise.audioservice.AudioService"
                  android:foregroundServiceType="mediaPlayback"
                  android:exported="true"
                  android:stopWithTask="false">
                  <intent-filter>
                      <action android:name="android.media.browse.MediaBrowserService" />
                  </intent-filter>
              </service>
              <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.MEDIA_BUTTON" />
                  </intent-filter>
              </receiver>
          '''
          if 'com.ryanheise.audioservice.AudioService' not in content:
              i = content.index('</application>')
              content = content[:i] + service + '\n    ' + content[i:]
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          PYEOF

      - name: Patch Android permission check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          path = 'lib/main.dart'
          with open(path, encoding='utf-8') as f:
              content = f.read()
          if "package:permission_handler/permission_handler.dart" not in content:
              content = content.replace(
                  "import 'package:photo_manager/photo_manager.dart';",
                  "import 'package:photo_manager/photo_manager.dart';\nimport 'package:permission_handler/permission_handler.dart';",
              )
          old = '''  Future<bool> requestPermission() async {\n    final state = await PhotoManager.requestPermissionExtend();\n    return state.hasAccess;\n  }'''
          new = '''  Future<bool> requestPermission() async {\n    PermissionStatus status;\n    if (await Permission.audio.isGranted) {\n      return true;\n    }\n    status = await Permission.audio.request();\n    if (status.isGranted) return true;\n    // PhotoManager uses the same Android media permission for scanning.\n    final state = await PhotoManager.requestPermissionExtend();\n    return state.hasAccess || status.isGranted;\n  }'''
          if old not in content:
              raise SystemExit('Expected permission function was not found')
          content = content.replace(old, new)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          PYEOF

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze audio-only app
        run: flutter analyze lib --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/audio-player.apk

      - name: Upload audio APK
        uses: actions/upload-artifact@v4
        with:
          name: audio-player-apk
          path: build/app/outputs/flutter-apk/audio-player.apk
          if-no-files-found: error
