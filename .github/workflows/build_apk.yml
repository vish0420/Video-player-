name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Arrange Flutter source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lib/models lib/services lib/theme lib/screens lib/widgets
          cp main.dart lib/main.dart
          cp video_item.dart lib/models/video_item.dart
          cp playback_service.dart lib/services/playback_service.dart
          cp video_scanner_service.dart lib/services/video_scanner_service.dart
          cp theme_service.dart lib/theme/theme_service.dart
          cp season_gradients.dart lib/theme/season_gradients.dart
          cp app_theme.dart lib/theme/app_theme.dart
          cp home_screen.dart lib/screens/home_screen.dart
          cp player_screen.dart lib/screens/player_screen.dart
          cp video_grid_tile.dart lib/widgets/video_grid_tile.dart
          cp continue_watching_fab.dart lib/widgets/continue_watching_fab.dart
          cp gesture_control_layer.dart lib/widgets/gesture_control_layer.dart
          cp player_controls_overlay.dart lib/widgets/player_controls_overlay.dart

      - name: Scaffold native Android project
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.vish0420 --project-name video_player_app _scaffold
          cp -r _scaffold/android ./android
          rm -rf _scaffold

      - name: Configure Android SDK for app and plugins
        shell: bash
        run: |
          set -euo pipefail
          APP_GRADLE=android/app/build.gradle.kts
          if [ -f "$APP_GRADLE" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$APP_GRADLE"
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' "$APP_GRADLE"
          else
            APP_GRADLE=android/app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' "$APP_GRADLE"
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/' "$APP_GRADLE"
          fi

          # Flutter plugins can declare their own compileSdk. Force every
          # Android library module to compile against 36 so AAR metadata from
          # modern AndroidX dependencies cannot fail the release build.
          ROOT_GRADLE=android/build.gradle.kts
          cat >> "$ROOT_GRADLE" <<'KOTLIN'

          subprojects {
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.api.dsl.LibraryExtension> {
                      compileSdk = 36
                  }
              }
          }
          KOTLIN

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" >/dev/null

      - name: Add required Android permissions
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - "$MANIFEST" << 'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          permissions = '''
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
          '''
          marker = "<application"
          if "READ_MEDIA_VIDEO" not in content:
              insert_at = content.index(marker)
              content = content[:insert_at] + permissions + "\n    " + content[insert_at:]
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Flutter application
        run: flutter analyze lib --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/video-player.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-player-apk
          path: build/app/outputs/flutter-apk/video-player.apk
          if-no-files-found: error
