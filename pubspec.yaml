name: video_player_app
description: A personal video and audio player for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_android_video: 1.3.8
  photo_manager: 3.6.2
  share_plus: ^13.3.0
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  file_picker: ^6.1.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
